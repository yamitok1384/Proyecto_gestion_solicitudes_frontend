<div class="h-screen bg-gray-100 flex flex-col">
  <!-- Encabezado de la página -->
  <header class="bg-white shadow-sm p-4 flex justify-between items-center">
    <h1 class="text-xl font-semibold text-gray-800">Panel de Control de Reportes</h1>
    <button
      (click)="onLogout()"
      class="bg-red-500 text-white font-bold py-2 px-4 rounded-lg hover:bg-red-600 transition-colors"
    >
      Cerrar Sesión
    </button>
  </header>

  <!-- Contenido principal -->
  <main class="flex-grow p-6 overflow-auto">
    <div class="container mx-auto">
      <h2 class="text-2xl font-bold mb-4 text-gray-700">Mis Incidencias</h2>
      
      <!-- Tabla de reportes (vacía por ahora) -->
      <div class="bg-white shadow-md rounded-lg overflow-hidden">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50">
            <tr>
              <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                Título
              </th>
              <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                Estado
              </th>
              <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                Fecha de Creación
              </th>
              <th scope="col" class="relative px-6 py-3">
                <span class="sr-only">Acciones</span>
              </th>
            </tr>
          </thead>
          <tbody class="bg-white divide-y divide-gray-200">
            <!-- Aquí se mostrarán los reportes dinámicamente -->
            <tr>
              <td colspan="4" class="px-6 py-4 whitespace-nowrap text-center text-sm text-gray-500">
                Cargando reportes...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>
