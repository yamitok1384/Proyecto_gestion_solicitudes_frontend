<div class="flex items-center justify-center h-screen bg-gray-100 p-4 sm:p-6 md:p-8">
  <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-200">
    <div class="text-center mb-6">
      <h1 class="text-3xl font-bold text-gray-800 mb-2">Iniciar Sesión</h1>
      <p class="text-sm text-gray-500">Bienvenido de nuevo, por favor ingresa tus credenciales.</p>
    </div>

    <!-- Formulario de Inicio de Sesión -->
    <form class="space-y-6" (ngSubmit)="onLoginSubmit()">
      <!-- Campo de Nombre de Usuario -->
      <div>
        <label for="username" class="block text-sm font-medium text-gray-700">Nombre de Usuario</label>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="Tu nombre de usuario"
          required
          [(ngModel)]="username"
          class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 text-sm"
        />
      </div>

      <!-- Campo de Contraseña -->
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Tu contraseña"
          required
          [(ngModel)]="password"
          class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 text-sm"
        />
      </div>

      <!-- Mensaje de Error (solo visible si hay un error) -->
      <div *ngIf="errorMessage" class="text-center text-red-600 font-medium text-sm">
        {{ errorMessage }}
      </div>

      <!-- Botón de Iniciar Sesión -->
      <div>
        <button
          type="submit"
          class="w-full flex justify-center py-2 px-4 border border-transparent rounded-xl shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
        >
          Iniciar Sesión
        </button>
      </div>
    </form>
  </div>
</div>
